name: CI Frontend Pipline

on: 
    push: 
        branches: 
            - "**"
        paths: 
            - "./MusicApp_FE/**"
    pull_request: 
        branches: 
            - "main"
        paths: 
            - "MusicApp_FE/**"

concurrency:
  group: ci-frontend
  cancel-in-progress: true

jobs: 
    build: 
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: ./MusicApp_FE
        permissions: 
            actions: read
            contents: read
            security-events: write

        steps: 
            - name: Checkout code 
              uses: actions/checkout@v7 
            
            - name: Set up Node.js 
              uses: actions/setup-node@v7
              with: 
                node-version: '24'
                cache: 'npm'
                cache-dependency-path: MusicApp_FE/package-lock.json

            - name: Install dependencies 
              run: npm install

            - name: lint
              run: npm run lint

            - name: Unit test
              run: npm run test

            - name: Build application
              run: npm run build

            - name: security scan
              run: npm audit

            - uses: actions/upload-artifact@v4
              with:
                name: frontend-dist
                path: MusicApp_FE/dist

    deploy: 
        runs-on: ubuntu-latest
        needs: build
        # Chỉ chạy Job deploy nếu code nằm trên nhánh main
        if: github.ref == 'refs/heads/main'   
        defaults: 
            run: 
                working-directory: ./MusicApp_FE

        steps: 
            - name: down-artifact
              uses: actions/download-artifact@v4
              with: 
                name: frontend-dist
                path: MusicApp_FE/dist

            # Login AWS bằng OIDC
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::587861287952:role/GitHubActions-S3DeployRole
                aws-region: us-east-1
            
            - name: Deploy to S3 
              run: | 
                aws s3 sync ./dist s3://${{secrets.music_app_frontend_bucket}} --delete
            
            - name: Invalidate CloudFront
              run: |
                aws cloudfront create-invalidation \
                    --distribution-id ${{secrets.cloudfront_distribution_id}} \
                    --paths "/*"
            
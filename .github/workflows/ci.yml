name: CI 

on: 
    push: 
        branches:
            - "**"
    pull_request:
        branches:
            - main

jobs: 
    build: 
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./MusicApp_BE
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            
            # Clone code vừa được commit về VM
            - name: Checkout source code
              uses: actions/checkout@v4
            
            # Cài Java
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with: 
                distribution: 'temurin'
                java-version: '21'
                cache: maven

            # Cấp quyền thực thi cho mvnw
            - name: Grant execute permission for mvnw
              run: chmod +x mvnw
            
            - name: lint test
              run: ./mvnw checkstyle:check

            # Run tất cả unit test trong project
            - name: Unit test
              run: ./mvnw test
            
            - name: Security scan 
              run: ./mvnw org.owasp:dependency-check-maven:check
              continue-on-error: false
              
            # Build
            - name: Build application
              run: ./mvnw -B package -DskipTests
            
            - name: Upload security report 
              uses: actions/upload-artifact@v4
              if: always()
              with: 
                name: security-report
                path: MusicApp_BE/target/dependency-check-report.html
                retention-days: 3

            - name: build image
              run: docker build -t music-app-be:latest .
            
            - name: trivy scan image
              uses: aquasecurity/trivy-action@0.35.0
              with: 
                image-ref: 'music-app-be:latest'
                format: 'sarif'
                output: 'trivy-results.sarif'
                severity: "HIGH,CRITICAL"
                exit-code: 1
            
            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with: 
                sarif_file: trivy-results.sarif
                


            
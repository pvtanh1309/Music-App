services:
  pgmaster:
    image: docker.io/bitnami/postgresql:latest
    container_name: pg-master
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${DB_PASSWORD:-app_user_1412}
      - POSTGRESQL_USERNAME=${DB_USERNAME:-app_user}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-app_user_1412}
      - POSTGRESQL_DATABASE=${DB_NAME:-SoundCloudDB}
    ports:
      - "5433:5432"
    volumes:
      - pg_master_data:/bitnami/postgresql
      - ./src/main/resources/schema_1.sql:/docker-entrypoint-initdb.d/schema_1.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app_user} -d ${DB_NAME:-SoundCloudDB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgslave:
    image: docker.io/bitnami/postgresql:latest
    container_name: pg-slave
    depends_on:
      - pgmaster
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pgmaster
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${DB_PASSWORD:-app_user_1412}
      - POSTGRESQL_USERNAME=${DB_USERNAME:-app_user}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-app_user_1412}
      - POSTGRESQL_DATABASE=${DB_NAME:-SoundCloudDB}
    ports:
      - "5434:5432" # Chạy ở port 5434 để không đụng hàng với Master ở Local
    volumes:
      - pg_slave_data:/bitnami/postgresql

  redismaster:
    image: docker.io/bitnami/redis:latest
    container_name: redis-master
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
      - REDIS_SSL_ENABLED=${REDIS_SSL_ENABLED:-true}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_master_data:/bitnami/redis/data

  redisslave:
    image: docker.io/bitnami/redis:latest
    container_name: redis-slave
    depends_on:
      - redismaster
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redismaster
      - REDIS_MASTER_PORT_NUMBER=${REDIS_PORT:-6379}
      - REDIS_MASTER_PASSWORD=${REDIS_PASSWORD:-redis} # Mật khẩu repl đăng nhập vào master
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis} # Mật khẩu của slave
      - REDIS_SSL_ENABLED=${REDIS_SSL_ENABLED:-true}
    ports:
      - "6380:6379"
    volumes:
      - redis_slave_data:/bitnami/redis/data

volumes:
  pg_master_data:
  pg_slave_data:
  redis_master_data:
  redis_slave_data:

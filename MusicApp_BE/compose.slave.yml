services:
  pgslave:
    image: docker.io/bitnami/postgresql:latest
    container_name: pg-slave
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=10.0.4.115
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${DB_PASSWORD:-app_user_1309}
      - POSTGRESQL_USERNAME=${DB_USERNAME:-app_user}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-app_user_1309}
      - POSTGRESQL_DATABASE=${DB_NAME:-SoundCloudDB}
    ports:
      - "5434:5432" # Chạy ở port 5434 để không đụng hàng với Master ở Local
    volumes:
      - pg_slave_data:/bitnami/postgresql

  redisslave:
    image: docker.io/bitnami/redis:latest
    container_name: redis-slave
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=10.0.4.115
      - REDIS_MASTER_PORT_NUMBER=${REDIS_PORT:-6379}
      - REDIS_MASTER_PASSWORD=${REDIS_PASSWORD:-redis123} # Mật khẩu repl đăng nhập vào master
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123} # Mật khẩu của slave
      - REDIS_SSL_ENABLED=${REDIS_SSL_ENABLED:-true}
    ports:
      - "6380:6379" # Chạy ở port 6380 để không đụng hàng với Master ở Local
    volumes:
      - redis_slave_data:/bitnami/redis/data

volumes:
  pg_slave_data:
  redis_slave_data:
